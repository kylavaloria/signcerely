name: Testnet integration

# Runs the real signing flow against the deployed testnet contract.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/src/lib/stellar/**", "app/src/lib/invite-keys.ts", "contracts/**", ".github/workflows/testnet-integration.yml"]

defaults:
  run:
    working-directory: app

jobs:
  testnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Full flow on testnet
        env:
          INTEGRATION: "1"
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_CONTRACT_ID: CDS3E7DNMFRC6XOJXK3F5ID32Y36RGR3PAXKZOR3NC3AYSERIO2XQ4ZV
        run: npx vitest run src/lib/stellar/testnet.integration.test.ts --reporter=verbose
