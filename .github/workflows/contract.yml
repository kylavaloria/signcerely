name: Contract

on:
  push:
    branches: [main]
    paths: ["contracts/**", "Cargo.toml", "Cargo.lock", ".github/workflows/contract.yml"]
  pull_request:
    paths: ["contracts/**", "Cargo.toml", "Cargo.lock", ".github/workflows/contract.yml"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build WASM
        run: cargo build --locked --release --target wasm32v1-none -p its-your-sign
      - uses: actions/upload-artifact@v4
        with:
          name: its_your_sign.wasm
          path: target/wasm32v1-none/release/its_your_sign.wasm
