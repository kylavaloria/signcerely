<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 420px; overflow: hidden; font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
  .bg {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    background:
      radial-gradient(520px 320px at 88% 10%, rgba(255,255,255,.85), transparent 70%),
      radial-gradient(600px 380px at 8% 105%, rgba(107,179,247,.55), transparent 70%),
      linear-gradient(160deg, #cfe5fc 0%, #e4f0fd 45%, #f6faff 100%);
  }
  .grid {
    position: absolute; inset: 0; opacity: .5;
    background-image: linear-gradient(rgba(31,111,214,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(31,111,214,.06) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
  }
  .orb { position: absolute; border-radius: 50%; background: radial-gradient(circle at 32% 26%, #d6ebff 0%, #7fbcf8 30%, #3d8fe8 65%, #1a5fc0 100%); box-shadow: 0 18px 40px rgba(31,111,214,.28); }
  .sun { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6a8, #ffdd1f 55%, #f0bf00); box-shadow: 0 10px 24px rgba(240,191,0,.35); }
  .left { position: absolute; left: 84px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 18px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand svg { width: 84px; height: 84px; filter: drop-shadow(0 12px 22px rgba(31,111,214,.35)); }
  .word { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 82px; letter-spacing: -2.5px; color: #1f6fd6; line-height: 1; }
  .tag { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 34px; color: #12305c; letter-spacing: -.6px; }
  .tag mark { background: linear-gradient(transparent 58%, #ffdd1f 58%, #ffdd1f 88%, transparent 88%); color: inherit; padding: 0 2px; }
  .sub { font-size: 19px; color: #2f4a75; max-width: 560px; line-height: 1.5; }
  .chips { display: flex; gap: 10px; margin-top: 4px; }
  .chip { font-family: "JetBrains Mono", monospace; font-size: 14px; font-weight: 500; color: #1f6fd6; background: rgba(255,255,255,.8); border: 1.5px solid #9cc6f5; padding: 6px 12px; border-radius: 999px; }
  .chip.y { color: #12305c; background: #fff3a6; border-color: #f0d24a; }
  .paper {
    position: absolute; right: 120px; top: 34px; width: 300px; height: 352px; background: #fff; border-radius: 14px;
    box-shadow: 0 2px 4px rgba(15,27,61,.06), 0 28px 60px rgba(31,111,214,.25); transform: rotate(4deg); padding: 30px 28px;
  }
  .paper .t { height: 14px; width: 62%; background: #12305c; border-radius: 4px; opacity: .85; }
  .paper .l { height: 8px; background: #dbe6f5; border-radius: 4px; margin-top: 12px; }
  .sigrow { position: absolute; left: 28px; right: 28px; bottom: 44px; display: flex; gap: 18px; }
  .sig { flex: 1; border-bottom: 2px solid #12305c; height: 58px; position: relative; }
  .sig svg { position: absolute; left: 0; bottom: 2px; width: 100%; height: 52px; }
  .sig span { position: absolute; top: 64px; left: 0; font-size: 10px; color: #5a6f96; }
  .stamp {
    position: absolute; right: -36px; top: 120px; transform: rotate(-12deg); border: 4px solid #1f9d61; color: #1f9d61; border-radius: 12px;
    padding: 8px 14px; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 1px; background: rgba(227,245,236,.92);
  }
  .stamp small { display: block; font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0; font-weight: 500; text-align: center; }
  .px { position: absolute; image-rendering: pixelated; }
</style>
</head>
<body>
<div class="bg">
  <div class="grid"></div>
  <div class="orb" style="width:120px;height:120px;right:40px;bottom:-30px"></div>
  <div class="orb" style="width:46px;height:46px;left:620px;top:46px"></div>
  <div class="sun" style="width:34px;height:34px;right:470px;top:300px"></div>
  <div class="sun" style="width:18px;height:18px;left:52px;top:52px"></div>
  <!-- pixel sparkles -->
  <svg class="px" style="left:690px;top:300px" width="40" height="40" viewBox="0 0 10 10" shape-rendering="crispEdges"><path fill="#ffdd1f" d="M4 0h2v3h-2zM4 7h2v3h-2zM0 4h3v2h-3zM7 4h3v2h-3zM3 3h4v4h-4z"/></svg>
  <svg class="px" style="right:70px;top:40px" width="30" height="30" viewBox="0 0 10 10" shape-rendering="crispEdges"><path fill="#4a9bf0" d="M4 0h2v3h-2zM4 7h2v3h-2zM0 4h3v2h-3zM7 4h3v2h-3zM3 3h4v4h-4z"/></svg>

  <div class="left">
    <div class="brand">
      <svg viewBox="0 0 40 40"><defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6BB3F7"/><stop offset=".55" stop-color="#2F86E8"/><stop offset="1" stop-color="#1A5FC0"/></linearGradient>
        <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <linearGradient id="yy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE95C"/><stop offset="1" stop-color="#FFD400"/></linearGradient>
      </defs><rect width="40" height="40" rx="11" fill="url(#g)"/><rect x="1.5" y="1.5" width="37" height="18" rx="9.5" fill="url(#hl)"/><path d="M8 25.5c2.6-5.8 5.6-10 7.6-9.4 2.2.7-1.8 8.4.2 8.9 1.8.4 4.2-4.6 6-4 1.3.4.2 2.6 1.6 2.9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M23.4 23.9l3.4 3.4 7-9.6" fill="none" stroke="url(#yy)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="word">Signcerely</span>
    </div>
    <p class="tag">Mean it once. <mark>We’ll remember.</mark></p>
    <p class="sub">Send a PDF, choose who signs and in what order, and get a signed copy anyone can check on Stellar.</p>
    <div class="chips"><span class="chip">{ signed on Stellar }</span><span class="chip y">• anyone can verify</span></div>
  </div>

  <div class="paper">
    <div class="t"></div>
    <div class="l" style="width:92%"></div><div class="l" style="width:84%"></div><div class="l" style="width:88%"></div>
    <div class="l" style="width:70%"></div><div class="l" style="width:90%;margin-top:22px"></div><div class="l" style="width:80%"></div><div class="l" style="width:60%"></div>
    <div class="sigrow">
      <div class="sig"><svg viewBox="0 0 120 52" fill="none" stroke="#1f3f8f" stroke-width="2.6" stroke-linecap="round"><path d="M6 40c10-22 20-34 26-30 7 5-8 30 0 30 6 0 12-16 18-14 5 2-1 10 5 11 8 1 14-10 22-12 6-1 4 6 10 6 6 0 12-6 18-9"/></svg><span>Maria Santos</span></div>
      <div class="sig"><svg viewBox="0 0 120 52" fill="none" stroke="#1f3f8f" stroke-width="2.6" stroke-linecap="round"><path d="M8 36c6-16 16-26 22-22 5 4-6 22 2 22 10 0 14-20 24-18 6 2-4 14 4 15 9 1 18-12 28-14 6-1 8 4 14 3 4-1 8-4 10-6"/></svg><span>Juan Dela Cruz</span></div>
    </div>
    <div class="stamp">VERIFIED<small>on Stellar</small></div>
  </div>
</div>
</body>
</html>
